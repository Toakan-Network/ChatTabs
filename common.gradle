// Shared build for every Minecraft version. Each versions/<mc>/ subproject applies Loom, then this file; its own
// gradle.properties sets the Minecraft, Fabric API, YACL and Mod Menu versions and the fabric.mod.json range.
// The code is the one src/ folder at the root, compiled once per version.

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
	// Every version's jar in the root build/libs.
	libsDirectory = rootProject.layout.buildDirectory.dir("libs")
}

sourceSets {
	main {
		java.srcDirs = [rootProject.file("src/main/java")]
		resources.srcDirs = [rootProject.file("src/main/resources")]
	}
	test {
		java.srcDirs = [rootProject.file("src/test/java")]
		resources.srcDirs = []
	}
}

repositories {
	maven { url = "https://maven.isxander.dev/releases" }
	maven {
		url = "https://maven.terraformersmc.com/releases"
		content { includeGroup "com.terraformersmc" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu (optional): its "Configure" button opens Settings. Only Mod Menu loads
	// chattabs.compat.ModMenuCompat (fabric.mod.json entrypoint).
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// YetAnotherConfigLib for the Settings screen. Required at runtime ("depends" in fabric.mod.json), not bundled.
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Unit tests for the plain logic (message classifying); nothing here ships in the jar.
	testImplementation platform("org.junit:junit-bom:5.14.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", project.minecraft_range

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": project.minecraft_range
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from(rootProject.file("NOTICE")) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
